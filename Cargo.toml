[package]
name = "teamclaude"
version = "2.2.0"
edition = "2021"
rust-version = "1.80"
description = "Multi-account Claude proxy with automatic quota-based rotation for Claude Code, rewritten in Rust"
license = "MIT"
repository = "https://github.com/NodeSpy/teamclaude"
readme = "README.md"
keywords = ["claude", "anthropic", "proxy", "load-balancer", "multi-account"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "teamclaude"
path = "src/lib.rs"

[[bin]]
name = "teamclaude"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "stream", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
x509-parser = "0.16"
rustls-pemfile = "2"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
webbrowser = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
parking_lot = "0.12"
percent-encoding = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
